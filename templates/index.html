<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Lumi — Séances cinéma Lyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="entete">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Lumi" class="logo">
        <h1>Lumi</h1>
    </div>
    <p>Les séances de tes cinémas lyonnais, réunies sur une page.</p>

    <div class="barre-outils">
        <div class="filtres">
            <div class="filtre-cinema">
                <button id="bouton-filtre"><span>Filtres</span><span>▾</span></button>
                <div class="panneau-filtres" style="display: none;">

                    <div class="section-filtre">
                        <h4 class="titre-section"><span>Cinéma</span><span class="fleche">▸</span></h4>
                        <div class="options-filtre" id="options-cinema" style="display: none;">
                            <label><input type="checkbox" value="Pathé Bellecour" checked> Pathé Bellecour</label>
                            <label><input type="checkbox" value="Pathé Carré de Soie" checked> Pathé Carré de Soie</label>
                            <label><input type="checkbox" value="Institut Lumière" checked> Institut Lumière</label>
                            <label><input type="checkbox" value="UGC Ciné Cité Lyon Part-Dieu" checked> UGC Part-Dieu</label>
                            <label><input type="checkbox" value="UGC Ciné Cité Internationale" checked> UGC Cité Internationale</label>
                            <label><input type="checkbox" value="Cinéma Comœdia" checked> Comœdia</label>
                        </div>
                    </div>

                    <div class="section-filtre">
                        <h4 class="titre-section"><span>Langue</span><span class="fleche">▸</span></h4>
                        <div class="options-filtre" id="options-langue" style="display: none;">
                            <label><input type="checkbox" value="VO" checked> VO</label>
                            <label><input type="checkbox" value="VF" checked> VF</label>
                        </div>
                    </div>

                    <div class="section-filtre">
                        <h4 class="titre-section"><span>Format</span><span class="fleche">▸</span></h4>
                        <div class="options-filtre" id="options-format" style="display: none;">
                            <label><input type="checkbox" value="Standard" checked> Standard</label>
                            <label><input type="checkbox" value="3D" checked> 3D</label>
                            <label><input type="checkbox" value="IMAX" checked> IMAX</label>
                            <label><input type="checkbox" value="4DX" checked> 4DX</label>
                        </div>
                    </div>

                </div>
            </div>

            <div class="tri-conteneur">
                <select id="tri">
                    <option value="defaut">Trier par...</option>
                    <option value="sortie-asc">Date de sortie (croissant)</option>
                    <option value="sortie-desc">Date de sortie (décroissant)</option>
                </select>
                <span class="fleche-tri">▾</span>
            </div>
        </div>

        <div class="recherche-date">
            <div class="selecteur-jour">
                <label for="jour">Voir les séances du :</label>
                <input type="date" id="jour" min="{{ aujourdhui }}">
            </div>

            <div class="selecteur-periode">
                <label for="periode">Sur une période :</label>
                <select id="periode">
                    <option value="">Choisir...</option>
                    <option value="1">1 semaine</option>
                    <option value="2">2 semaines</option>
                    <option value="3">3 semaines</option>
                </select>
            </div>
        </div>
    </div>

       
    <div id="seances">
        <p>Chargement des séances...</p>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
